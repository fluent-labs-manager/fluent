name: "Fluent CI"

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Run mdl for check markdown formatting
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml

  code-linting:
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Prepare action environment
        uses: ./.github/actions/setup-node

      - name: Lint
        run: npm run lint:ci

  code-unit-testing:
    environment: ci
    timeout-minutes: 5
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - name: Prepare action environment
        uses: ./.github/actions/setup-node

      - name: Unit tests
        run: npm run test:unit:ci
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_SOCKET_URL: ${{ secrets.VITE_API_SOCKET_URL }}
          VITE_SENTRY_DSN_URL: ${{ secrets.VITE_SENTRY_DSN_URL }}

  code-e2e-testing:
    environment: ci
    timeout-minutes: 20
    runs-on: ubuntu-latest
    needs: [ code-linting, code-unit-testing ]

    steps:
      - uses: actions/checkout@v6

      - name: Prepare action environment
        uses: ./.github/actions/setup-node

      - name: Install Playwright browsers
        run: npx playwright install chromium

      - name: Build app for preview
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_SOCKET_URL: ${{ secrets.VITE_API_SOCKET_URL }}
          VITE_SENTRY_DSN_URL: ${{ secrets.VITE_SENTRY_DSN_URL }}

      - name: Run E2E tests
        run: npx playwright test e2e/
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}

  create-build:
    environment: ci
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [ code-linting, code-unit-testing, code-e2e-testing ]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6

      - name: Prepare action environment
        uses: ./.github/actions/setup-node

      - name: Create build
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_SOCKET_URL: ${{ secrets.VITE_API_SOCKET_URL }}
          VITE_SENTRY_DSN_URL: ${{ secrets.VITE_SENTRY_DSN_URL }}

  create-release-build:
    environment: production
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [ code-linting, code-unit-testing, code-e2e-testing ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Prepare action environment
        uses: ./.github/actions/setup-node

      - name: Create build with Sentry release
        run: npm run build
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_SOCKET_URL: ${{ secrets.VITE_API_SOCKET_URL }}
          VITE_SENTRY_DSN_URL: ${{ secrets.VITE_SENTRY_DSN_URL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 3

  deploy:
    environment: production
    timeout-minutes: 10
    runs-on: ubuntu-latest
    needs: [create-release-build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Setup SSH
        run: ./.github/scripts/setup-ssh.sh
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

      - name: Rsync dist to server
        run: ./.github/scripts/rsync-dist.sh
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_HOST: ${{ secrets.SSH_HOST }}

  send-commits-notification:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6
      - name: Prepare commit message
        id: prepare
        env:
          COMMITS_JSON: ${{ toJSON(github.event.commits) }}
        run: .github/scripts/prepare-commits.sh

      - name: Send TG message
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          to: ${{ secrets.CHAT_ID }}
          token: ${{ secrets.BOT_TOKEN }}
          message: |
            New commits in ${{ github.repository }}

            ${{ github.actor }} has pushed ${{ steps.prepare.outputs.count }} commit(-s) to ${{ github.ref_name }}

            ${{ steps.prepare.outputs.commit_list }}

            🔗 ${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }}

            #commit

name: "Fluent CI"

on:
  pull_request:
    types: [ opened, synchronize, reopened ]
  push:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  markdown-formatting:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Run mdl for check markdown formatting
        uses: nosborn/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config_file: .markdownlint.yaml

  code-linting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run lint:ci

  code-testing:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run test:unit:ci

  create-build:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    needs: [ code-linting, code-testing ]
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci
      - run: npm run build

  send-commits-notification:
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Prepare commit message
        id: prepare
        env:
          COMMITS_JSON: ${ { toJSON(github.event.commits) } }
        run: .github/scripts/prepare-commits.sh

      - name: Send TG message
        uses: appleboy/telegram-action@214f06cfa3d3a588c1472116889437e7c6fd29b1
        with:
          to: ${ { secrets.CHAT_ID } }
          token: ${ { secrets.BOT_TOKEN } }
          message: |
            New commits in ${{ github.repository }}
            
            ${{ github.actor }} has pushed ${{ steps.prepare.outputs.count }} commit(-s) to ${{ github.ref_name }}
            
            ${{ steps.prepare.outputs.commit_list }}
            
            🔗 ${{ github.server_url }}/${{ github.repository }}/commits/${{ github.ref_name }}
            
            #commit

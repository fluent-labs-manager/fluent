name: "Setup Node.js & environment"
description: "Setup Node.js dependencies for GitHub Actions"
author: scobca

runs:
  using: "composite"
  steps:
    - name: Setup Node
      uses: actions/setup-node@v7
      with:
        node-version: "24"
        cache: "npm"

    - name: Install dependencies
      shell: bash
      run: npm ci
